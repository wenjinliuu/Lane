node_filters:
  auto_exclude:
    - 慢速
    - 限速
    - 维护
    - 实验
    - 不可用
    - 故障
    - slow
    - limited
    - maintenance
    - experimental
    - unavailable
    - offline
  fallback_exclude:
    - 维护
    - 不可用
    - 故障
    - maintenance
    - unavailable
    - offline
  high_multiplier_pattern: '(?:[2-9]|[1-9][0-9]+)(?:\.[0-9]+)?\s*(?:x|X|×|倍)'

base_groups:
  - name: Manual
    type: select
  - name: Auto
    type: url-test
  - name: Fallback
    type: fallback

regions:
  - name: United States
    code: US
    auto_name: US Auto
    pattern: '(?:🇺🇸|美国|美國|美西|美东|美東|洛杉矶|洛杉磯|圣何塞|聖何塞|西雅图|西雅圖|纽约|紐約|芝加哥|达拉斯|達拉斯|华盛顿|華盛頓|(?:^|[^A-Za-z])(?:US|USA|SFO|LAX|SEA|NYC|IAD|DFW)(?:[0-9]+)?(?:$|[^A-Za-z]))'
  - name: Japan
    code: JP
    auto_name: JP Auto
    pattern: '(?:🇯🇵|日本|东京|東京|大阪|名古屋|埼玉|(?:^|[^A-Za-z])(?:JP|JPN|NRT|HND|KIX)(?:[0-9]+)?(?:$|[^A-Za-z]))'
  - name: Hong Kong
    code: HK
    auto_name: HK Auto
    pattern: '(?:🇭🇰|香港|深港|沪港|滬港|京港|Hong\s*Kong|(?:^|[^A-Za-z])(?:HK|HKG)(?:[0-9]+)?(?:$|[^A-Za-z]))'
  - name: Taiwan
    code: TW
    auto_name: TW Auto
    pattern: '(?:🇹🇼|台湾|台灣|台北|臺北|新北|台中|高雄|(?:^|[^A-Za-z])(?:TW|TWN|TPE|KHH)(?:[0-9]+)?(?:$|[^A-Za-z]))'
  - name: Singapore
    code: SG
    auto_name: SG Auto
    pattern: '(?:🇸🇬|新加坡|狮城|獅城|Singapore|(?:^|[^A-Za-z])(?:SG|SGP|SIN)(?:[0-9]+)?(?:$|[^A-Za-z]))'
  - name: South Korea
    code: KR
    auto_name: KR Auto
    pattern: '(?:🇰🇷|韩国|韓國|南韩|南韓|首尔|首爾|釜山|South\s*Korea|Korea|(?:^|[^A-Za-z])(?:KR|KOR|ICN)(?:[0-9]+)?(?:$|[^A-Za-z]))'

service_groups:
  - AI
  - Schwab
  - Brokerage
  - Crypto
  - YouTube
  - TikTok
  - Emby
  - Streaming
  - Gaming
  - Telegram
  - Social
  - Developer
  - Google
  - Microsoft
  - Apple
  - Final

service_options:
  - Manual
  - DIRECT
  - Auto
  - Fallback
  - United States
  - Japan
  - Hong Kong
  - Taiwan
  - Singapore
  - South Korea
