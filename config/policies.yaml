base_groups:
  - name: Manual
    type: select

# Region patterns intentionally use flags, full country/region names and bounded
# Latin codes only. City names and one-character abbreviations are too ambiguous
# across providers. Singapore additionally accepts 狮/獅 as the settled exception.
regions:
  - name: United States
    code: US
    auto_name: US Auto
    surge_smart_name: US Auto Smart
    manual_name: US Manual
    pattern: '(?:🇺🇸|美国|United\s*States|(?:^|[^A-Za-z])(?:US|USA)(?:[0-9]+)?(?:$|[^A-Za-z]))'
  - name: Japan
    code: JP
    auto_name: JP Auto
    surge_smart_name: JP Auto Smart
    manual_name: JP Manual
    pattern: '(?:🇯🇵|日本|Japan|(?:^|[^A-Za-z])JP(?:[0-9]+)?(?:$|[^A-Za-z]))'
  - name: Hong Kong
    code: HK
    auto_name: HK Auto
    surge_smart_name: HK Auto Smart
    manual_name: HK Manual
    pattern: '(?:🇭🇰|香港|Hong\s*Kong|(?:^|[^A-Za-z])HK(?:[0-9]+)?(?:$|[^A-Za-z]))'
  - name: Taiwan
    code: TW
    auto_name: TW Auto
    surge_smart_name: TW Auto Smart
    manual_name: TW Manual
    pattern: '(?:🇹🇼|台湾|臺灣|Taiwan|(?:^|[^A-Za-z])TW(?:[0-9]+)?(?:$|[^A-Za-z]))'
  - name: Singapore
    code: SG
    auto_name: SG Auto
    surge_smart_name: SG Auto Smart
    manual_name: SG Manual
    pattern: '(?:🇸🇬|新加坡|狮|獅|Singapore|(?:^|[^A-Za-z])SG(?:[0-9]+)?(?:$|[^A-Za-z]))'

