rulesets:
  # LAN stays first. The custom file carries the RFC private and special-use
  # prefixes; no_resolve applies to IP rules only, so the first IP rule in the
  # profile does not force a lookup for every domain that reaches it. Without
  # these prefixes, traffic addressed to a router or a NAS by IP matches nothing
  # and falls through to FINAL, which proxies it.
  - id: lan
    title: LAN
    policy: DIRECT
    v2fly: [private]
    custom: rules/custom/lan.list
    no_resolve: true

  - id: custom-direct
    title: Custom Direct
    policy: DIRECT
    custom: rules/custom/direct.list
    omit_if_empty: true

  - id: custom-proxy
    title: Custom Proxy
    policy: Manual
    custom: rules/custom/proxy.list
    omit_if_empty: true

  - id: apple-cn
    title: AppleCN
    policy: DIRECT
    text_source: apple_cn

  # GoogleCN stays out of this profile list. A complete, independently reusable
  # copy is generated through full_only_rulesets below, but no default profile is
  # allowed to reference it. Google traffic therefore follows the Google group.
  - id: ai
    title: AI
    policy: AI
    v2fly: [category-ai-!cn]

  - id: schwab
    title: Schwab
    policy: Schwab
    v2fly: [schwab]
    custom: rules/custom/schwab.list

  - id: brokerage
    title: Brokerage
    policy: Brokerage
    v2fly: [futu, itiger, longbridge]
    custom: rules/custom/brokerage-domain.list

  - id: crypto
    title: Crypto
    policy: Crypto
    v2fly: [binance, okx, bybit]
    custom: rules/custom/crypto.list

  - id: youtube
    title: YouTube
    policy: YouTube
    v2fly: [youtube]

  - id: tiktok
    title: TikTok
    policy: TikTok
    v2fly: [tiktok]

  - id: emby
    title: Emby
    policy: Emby
    v2fly: [category-emby]
    custom: rules/custom/emby.list

  - id: streaming
    title: Streaming
    policy: Streaming
    v2fly: [netflix, disney, hbo, primevideo, hulu, spotify, twitch, apple-tvplus, apple-music]

  - id: gaming
    title: Gaming
    policy: Gaming
    v2fly: [category-games-!cn]

  - id: telegram
    title: Telegram
    policy: Telegram
    v2fly: [telegram]

  - id: social
    title: Social
    policy: Social
    v2fly: [category-social-media-!cn, discord, reddit, whatsapp, pinterest]

  - id: developer
    title: Developer
    policy: Developer
    v2fly: [category-dev]

  - id: google
    title: Google
    policy: Google
    v2fly: [google]

  - id: microsoft
    title: Microsoft
    policy: Microsoft
    v2fly: [microsoft]

  - id: apple
    title: Apple
    policy: Apple
    v2fly: [apple]

  # Its policy is Final, the same destination as the profile's MATCH rule, so this
  # set never sends traffic to a different exit. Its job is placement: it claims
  # known non-CN domains before china, cn-ip and GEOIP,CN can direct-connect them
  # by mistake. v2fly's cn list includes tld-cn, so foreign companies' .cn domains
  # appear in both lists; whichever comes first wins. Deleting this set would flip
  # 567 domains from Final to DIRECT, and would also leave GEOIP,CN's known
  # mainland-IP misjudgements unguarded. Keep it and cn-ip; drop at most one.
  - id: proxy
    title: General Proxy
    policy: Final
    v2fly: [geolocation-!cn]

  - id: china
    title: China
    policy: DIRECT
    v2fly: [cn]

  # Domain rules above must get first refusal before any service IP rules can
  # trigger or skip resolution. LAN is the deliberate exception at position one.
  - id: brokerage-ip
    title: Brokerage IP
    policy: Brokerage
    custom: rules/custom/brokerage-ip.list
    no_resolve: true

  - id: telegram-ip
    title: Telegram IP
    policy: Telegram
    text_source: telegram_cidr
    no_resolve: true

  # cn-ip must stay last and must NOT carry no_resolve. A domain request skips a
  # no-resolve IP rule entirely, so adding it here would hand the mainland verdict
  # to whatever GeoIP database each client happens to ship, which is the opposite
  # of what this set exists for. GEOIP,CN follows as a second layer for prefixes
  # this snapshot misses.
  - id: cn-ip
    title: CN IP
    policy: DIRECT
    text_source: cn_ip_primary

# These complete rulesets are published only under rules-full/. They are never
# referenced by Lane profiles and are excluded from profile residual ordering.
full_only_rulesets:
  # google.china.conf is a DNS acceleration list, not a reachability guarantee.
  # It remains available for explicit expert use, while default Google traffic
  # stays on the Google policy group.
  - id: google-cn
    title: GoogleCN (full only)
    policy: DIRECT
    text_source: google_cn
