rulesets:
  # LAN stays first. The custom file carries the RFC private and special-use
  # prefixes; no_resolve applies to IP rules only, so the first IP rule in the
  # profile does not force a lookup for every domain that reaches it. Without
  # these prefixes, traffic addressed to a router or a NAS by IP matches nothing
  # and falls through to FINAL, which proxies it.
  - id: lan
    title: LAN
    policy: DIRECT
    v2fly: [private]
    custom: rules/custom/lan.list
    no_resolve: true

  - id: custom-direct
    title: Custom Direct
    policy: DIRECT
    custom: rules/custom/direct.list
    omit_if_empty: true

  - id: custom-proxy
    title: Custom Proxy
    policy: Manual
    custom: rules/custom/proxy.list
    omit_if_empty: true

  - id: apple-cn
    title: AppleCN
    policy: DIRECT
    v2fly: [apple]
    v2fly_require: [cn]
    text_source: apple_cn

  - id: ai
    title: AI
    policy: AI
    v2fly: [category-ai-!cn]

  - id: schwab
    title: Schwab
    policy: Schwab
    v2fly: [schwab]
    custom: rules/custom/schwab.list

  - id: brokerage
    title: Brokerage
    policy: Brokerage
    v2fly: [futu, itiger, longbridge]
    custom: rules/custom/brokerage-domain.list

  - id: crypto
    title: Crypto
    policy: Crypto
    v2fly: [binance, okx, bybit]
    custom: rules/custom/crypto.list

  - id: youtube
    title: YouTube
    policy: YouTube
    v2fly: [youtube]

  - id: tiktok
    title: TikTok
    policy: TikTok
    v2fly: [tiktok]

  - id: emby
    title: Emby
    policy: Emby
    v2fly: [category-emby]
    custom: rules/custom/emby.list

  - id: streaming
    title: Streaming
    policy: Streaming
    v2fly: [netflix, disney, hbo, primevideo, hulu, spotify, twitch, apple-tvplus, apple-music]

  - id: gaming
    title: Gaming
    policy: Gaming
    v2fly: [category-games-!cn]

  - id: telegram
    title: Telegram
    policy: Telegram
    v2fly: [telegram]

  - id: social
    title: Social
    policy: Social
    v2fly: [category-social-media-!cn, discord, reddit, whatsapp, pinterest]

  - id: developer
    title: Developer
    policy: Developer
    v2fly: [category-dev]

  - id: google
    title: Google
    policy: Google
    v2fly: [google]

  - id: microsoft
    title: Microsoft
    policy: Microsoft
    v2fly: [microsoft]

  - id: apple
    title: Apple
    policy: Apple
    v2fly: [apple]

  # Brokerage IP must precede China and CN-IP. Real-device Futu trading tests
  # showed that overlapping mainland ranges are otherwise claimed by a DIRECT
  # rule before the Brokerage policy can see them. no_resolve keeps this IP-only
  # exception from forcing DNS resolution for ordinary domain requests.
  - id: brokerage-ip
    title: Brokerage IP
    policy: Brokerage
    custom: rules/custom/brokerage-ip.list
    no_resolve: true

  # China deliberately precedes General Proxy. v2fly's cn list includes tld-cn,
  # so known mainland domains and Chinese entry points take the DIRECT path even
  # when they overlap geolocation-!cn. Narrow proxy exceptions belong in an
  # earlier service rule or custom-proxy, not in a reversed global order.
  - id: china
    title: China
    policy: DIRECT
    v2fly: [cn]

  # Its policy is Final, the same destination as the profile's MATCH rule, so this
  # set never sends traffic to a different exit. Its job is placement: after China
  # has claimed known mainland domains, it protects known non-CN domains from
  # later service IP, CN-IP and GEOIP,CN classifications. Keep the complete set.
  - id: proxy
    title: General Proxy
    policy: Final
    v2fly: [geolocation-!cn]

  - id: telegram-ip
    title: Telegram IP
    policy: Telegram
    text_source: telegram_cidr
    no_resolve: true

  # cn-ip must stay last and must NOT carry no_resolve. A domain request skips a
  # no-resolve IP rule entirely, so adding it here would hand the mainland verdict
  # to whatever GeoIP database each client happens to ship, which is the opposite
  # of what this set exists for. GEOIP,CN follows as a second layer for prefixes
  # this snapshot misses.
  - id: cn-ip
    title: CN IP
    policy: DIRECT
    text_source: cn_ip_primary
