name: Update upstream rules

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "config/**"
      - ".github/workflows/update.yml"
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lane-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Build from current upstreams
        shell: bash
        run: |
          set +e
          lane build --refresh > lane-build.log 2>&1
          status=$?
          cat lane-build.log
          exit "$status"
      - name: Test and validate
        shell: bash
        run: |
          set +e
          { python -m pytest && lane check; } > lane-test.log 2>&1
          status=$?
          cat lane-test.log
          exit "$status"
      - name: Create compact AI diagnostic
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          import datetime
          import json
          from pathlib import Path

          target = Path(".cache/diagnostics/lane-update-report.json")
          if not target.exists():
              logs = []
              for name in ("lane-build.log", "lane-test.log"):
                  path = Path(name)
                  if path.exists():
                      logs.append(f"[{name}]\n{path.read_text(errors='replace')[-8000:]}")
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(json.dumps({
                  "schema": 1,
                  "status": "failed",
                  "reason": "build-or-validation-failure",
                  "timestamp": datetime.datetime.now(datetime.timezone.utc).isoformat(),
                  "workflow_run": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                  "log_tail": "\n\n".join(logs),
              }, ensure_ascii=False, indent=2) + "\n")
          PY
      - name: Write update summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          target = Path(".cache/diagnostics/lane-update-report.json")
          window = Path("dist/cn-ip-window.json")
          if target.exists():
              report = json.loads(target.read_text())
              lines = ["## Lane update failed", f"- Reason: {report.get('reason')}"]
          elif "${{ job.status }}" != "success":
              lines = ["## Lane update failed", "- See workflow logs for the failed step."]
          elif window.exists():
              report = json.loads(window.read_text())
              lines = ["## Lane update", f"- Status: {report.get('status')}"]
              for family, item in report.get("recovery", {}).get("families", {}).items():
                  lines.append(f"- {family}: {item['status']}; valid observation days: "
                               f"{len(item.get('observation_dates', []))}")
                  if item.get("reason"):
                      lines.append(f"  - {item['reason']}")
                  if item.get("status") == "observing":
                      lines.append(f"  - Pending addresses: +{item['pending_added_addresses']} "
                                   f"/-{item['pending_removed_addresses']}; retry automatically.")
              if report.get("status") == "partial":
                  lines.append("- Other rule updates proceed; retained/pending CN IP retries automatically.")
          else:
              lines = ["## Lane update", "- No CN-IP report was generated."]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY
      - name: Upload update reports and diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane-update-diagnostic-${{ github.run_id }}
          path: |
            .cache/diagnostics/
            lane-build.log
            lane-test.log
            dist/cn-ip-window.json
            dist/cn-ip-validation.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
      - name: Commit changed outputs
        shell: bash
        run: |
          if git diff --quiet -- dist; then
            echo "No upstream changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git commit -m "chore: update generated rules"
          git push
