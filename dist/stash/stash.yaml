# Generated by ProxyRules. Do not edit this file directly.
# Replace the NodeProvider URL locally; never publish a private subscription URL.
mode: rule
log-level: warning
ipv6: false
proxy-providers:
  NodeProvider:
    type: http
    url: https://example.com/replace-with-your-subscription
    path: ./proxy_providers/node-provider.yaml
    interval: 86400
    benchmark-url: http://cp.cloudflare.com/generate_204
    benchmark-timeout: 5
proxy-groups:
- name: Manual
  type: select
  use:
  - NodeProvider
  filter: (?i)^(?!.*(?:流量|剩余|到期|过期|重置|官网|客服|订阅|通知|公告|教程|traffic|quota|expire|expiry|reset|official|support|subscription|notice|tutorial)).+$
  icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Proxy.png
- name: Auto
  type: url-test
