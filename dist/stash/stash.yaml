  - NodeProvider
  filter: (?i)^(?!.*(?:流量|剩余|到期|过期|重置|官网|客服|订阅|通知|公告|教程|traffic|quota|expire|expiry|reset|official|support|subscription|notice|tutorial|慢速|限速|维护|实验|不可用|故障|slow|limited|maintenance|experimental|unavailable|offline|(?:[2-9]|[1-9][0-9]+)(?:\.[0-9]+)?\s*(?:x|X|×|倍))).+$
