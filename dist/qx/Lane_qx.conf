# Lane | Local profile template
# Last updated: 2026-09-01 23:34:56 (Asia/Shanghai)
# Lane 不提供节点；[server_local] 保持为空，[server_remote] 内置一条默认禁用的空占位资源。
# 两个节点模块只用于通过完整配置导入检查，不会添加虚拟节点。
# 导入后可在节点资源页面添加订阅；也可替换占位 URL，并将 enabled=false 改为 enabled=true。
# 建议复制/保存为本地配置，不跟随远程整份更新；节点与远程规则仍独立更新。
# 换用新版完整配置前，请备份节点资源与个人修改。
# Brokerage：富途/Moomoo 保留域名与 IP 覆盖；老虎、长桥仅保留实测关键域名；嘉信规则并入本组。
# Crypto：仅 Binance、OKX、Bybit、Bitget；当前网络可正常访问时，可手动选择 DIRECT。
# 上述两组默认均为 Manual；分流只控制网络路径，不保证入金或交易结果。
# AppleCN：命中苹果大陆服务名单时优先 DIRECT，其他 Apple 服务仍走 Apple 策略组。
# Google 不再有大陆直连例外名单，全部域名统一走 Google 策略组。
# LAN：私有网段与本地域名直连，位于全部规则之前，带 no-resolve。
# China：已知中国域名先直连；General Proxy 随后保护已知境外域名，避免被后续 IP 判断误导。
# General Proxy 策略同为 Final，不是另一个出口；它仍位于业务 IP / CN IP / GEOIP 之前。
# CN IP：gaoyifan IPv4+IPv6 五次三次共识窗直连兜底，位于精细规则之后、GEOIP / Final 之前。
# 占位资源不含节点且默认禁用；不要将 enabled=true 打开后仍保留占位 URL。

[general]
server_check_url = http://cp.cloudflare.com/generate_204
server_check_timeout = 5000
fallback_udp_policy = reject
dns_exclusion_list = *.stun.*.*, *.stun.*.*.*, *.stun.*.*.*.*, *.stun.*.*.*.*.*, *.n.n.srv.nintendo.net, *.stun.playstation.net, xbox.*.*.microsoft.com, *.*.xboxlive.com, *.msftncsi.com, *.msftconnecttest.com, *.lan, *.local
excluded_routes = 224.0.0.0/4, 239.255.255.250/32

[dns]
no-ipv6

[server_remote]
https://raw.githubusercontent.com/wenjinliuu/Lane/main/dist/qx/server-placeholder.conf, tag=Lane Placeholder, update-interval=-1, enabled=false

[server_local]
# Lane 不内置本地节点；保留空模块以满足 QX 完整配置导入检查。

