# Lane | Local profile template
# Last updated: 2026-09-14 11:18:04 (Asia/Shanghai)
# Lane 不提供节点；导入启用前，将你的订阅地址替换为本客户端支持的完整订阅链接。
# 建议复制/保存为本地配置，不跟随远程整份更新；节点与远程规则仍独立更新。
# 换用新版完整配置前，请备份并重新填入订阅地址及个人修改。
# Brokerage：富途/Moomoo 保留域名与 IP 覆盖；老虎、长桥仅保留实测关键域名；嘉信规则并入本组。
# Crypto：仅 Binance、OKX、Bybit、Bitget；当前网络可正常访问时，可手动选择 DIRECT。
# 上述两组默认均为 Proxy；分流只控制网络路径，不保证入金或交易结果。
# AppleCN：命中苹果大陆服务名单时优先 DIRECT，其他 Apple 服务仍走 Apple 策略组。
# Google 不再有大陆直连例外名单，全部域名统一走 Google 策略组。
# LAN：私有网段与本地域名直连，位于全部规则之前，带 no-resolve。
# China：已知中国域名先直连；General Proxy 随后保护已知境外域名，避免被后续 IP 判断误导。
# General Proxy 策略同为 Final，不是另一个出口；它仍位于业务 IP / CN IP / GEOIP 之前。
# CN IP：gaoyifan IPv4+IPv6 五次三次共识窗直连兜底，位于精细规则之后、GEOIP / Final 之前。

mode: rule
log-level: warning
ipv6: false
allow-lan: false
unified-delay: true
tcp-concurrent: true
profile:
  store-selected: true
  store-fake-ip: true
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - '*.stun.*.*'
  - '*.stun.*.*.*'
  - '*.stun.*.*.*.*'
  - '*.stun.*.*.*.*.*'
  - '*.n.n.srv.nintendo.net'
  - '*.stun.playstation.net'
  - xbox.*.*.microsoft.com
  - '*.*.xboxlive.com'
  - '*.msftncsi.com'
  - '*.msftconnecttest.com'
  - '*.lan'
  - '*.local'
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
# Clash Verge Rev（Windows / macOS / Linux 共用）：在下面的 url 填写机场提供的 Clash / Mihomo 节点订阅；第一份默认启用。
proxy-providers:
  Subscription1:
    type: http
    url: 你的订阅地址
    path: ./proxy_providers/Subscription1.yaml
    interval: 86400
    health-check:
      enable: true
      url: http://cp.cloudflare.com/generate_204
      interval: 600
      timeout: 5000
      lazy: true
  # 多订阅：取消下方 Subscription2 整块注释并填写；更多订阅复制整块，名称与 path 必须唯一。
  # 我的节点 与地区组使用 include-all-providers，会自动纳入全部订阅，无需修改策略组。
  # Subscription2:
  #   type: http
  #   url: 你的订阅地址
  #   path: ./proxy_providers/Subscription2.yaml
  #   interval: 86400
  #   health-check:
  #     enable: true
  #     url: http://cp.cloudflare.com/generate_204
  #     interval: 600
  #     timeout: 5000
  #     lazy: true

