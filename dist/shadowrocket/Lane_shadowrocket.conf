# Lane | Local profile template
# Last updated: 2026-09-01 01:49:20 (Asia/Shanghai)
# Brokerage：富途/Moomoo 保留域名与 IP 覆盖；老虎、长桥仅保留实测关键域名；嘉信规则并入本组。
# Crypto：仅 Binance、OKX、Bybit、Bitget；当前网络可正常访问时，可手动选择 DIRECT。
# 上述两组默认均为 Manual；分流只控制网络路径，不保证入金或交易结果。
# AppleCN：命中苹果大陆服务名单时优先 DIRECT，其他 Apple 服务仍走 Apple 策略组。
# Google 不再有大陆直连例外名单，全部域名统一走 Google 策略组。
# LAN：私有网段与本地域名直连，位于全部规则之前，带 no-resolve。
# China：已知中国域名先直连；General Proxy 随后保护已知境外域名，避免被后续 IP 判断误导。
# General Proxy 策略同为 Final，不是另一个出口；它仍位于业务 IP / CN IP / GEOIP 之前。
# CN IP：gaoyifan IPv4+IPv6 五次三次共识窗直连兜底，位于精细规则之后、GEOIP / Final 之前。

[General]
ipv6 = false
udp-policy-not-supported-behaviour = REJECT
tun-excluded-routes = 224.0.0.0/4, 239.255.255.250/32, ff02::fb/128
always-real-ip = *.stun.*.*, *.stun.*.*.*, *.stun.*.*.*.*, *.stun.*.*.*.*.*, *.n.n.srv.nintendo.net, *.stun.playstation.net, xbox.*.*.microsoft.com, *.*.xboxlive.com, *.msftncsi.com, *.msftconnecttest.com, *.lan, *.local
hijack-dns = 8.8.8.8:53, 8.8.4.4:53
proxy-test-url = http://cp.cloudflare.com/generate_204
test-timeout = 5
# Remote URL used to refresh this configuration.
update-url = https://raw.githubusercontent.com/wenjinliuu/Lane/main/dist/shadowrocket/Lane_shadowrocket.conf

# Service and region strategy groups.
# Shadowrocket 用内置 PROXY 策略代表首页选中的节点，因此不再生成 Manual 组；服务组默认跟随首页选择。
[Proxy Group]
AI = select,PROXY,DIRECT,US Auto,US Manual,JP Auto,JP Manual,HK Auto,HK Manual,TW Auto,TW Manual,SG Auto,SG Manual,policy-select-name=PROXY
Brokerage = select,PROXY,DIRECT,US Auto,US Manual,JP Auto,JP Manual,HK Auto,HK Manual,TW Auto,TW Manual,SG Auto,SG Manual,policy-select-name=PROXY
Crypto = select,PROXY,DIRECT,US Auto,US Manual,JP Auto,JP Manual,HK Auto,HK Manual,TW Auto,TW Manual,SG Auto,SG Manual,policy-select-name=PROXY
YouTube = select,PROXY,DIRECT,US Auto,US Manual,JP Auto,JP Manual,HK Auto,HK Manual,TW Auto,TW Manual,SG Auto,SG Manual,policy-select-name=PROXY
TikTok = select,PROXY,DIRECT,US Auto,US Manual,JP Auto,JP Manual,HK Auto,HK Manual,TW Auto,TW Manual,SG Auto,SG Manual,policy-select-name=PROXY
Emby = select,PROXY,DIRECT,US Auto,US Manual,JP Auto,JP Manual,HK Auto,HK Manual,TW Auto,TW Manual,SG Auto,SG Manual,policy-select-name=PROXY
Streaming = select,PROXY,DIRECT,US Auto,US Manual,JP Auto,JP Manual,HK Auto,HK Manual,TW Auto,TW Manual,SG Auto,SG Manual,policy-select-name=PROXY
Gaming = select,PROXY,DIRECT,US Auto,US Manual,JP Auto,JP Manual,HK Auto,HK Manual,TW Auto,TW Manual,SG Auto,SG Manual,policy-select-name=PROXY
Telegram = select,PROXY,DIRECT,US Auto,US Manual,JP Auto,JP Manual,HK Auto,HK Manual,TW Auto,TW Manual,SG Auto,SG Manual,policy-select-name=PROXY
Social = select,PROXY,DIRECT,US Auto,US Manual,JP Auto,JP Manual,HK Auto,HK Manual,TW Auto,TW Manual,SG Auto,SG Manual,policy-select-name=PROXY
Developer = select,PROXY,DIRECT,US Auto,US Manual,JP Auto,JP Manual,HK Auto,HK Manual,TW Auto,TW Manual,SG Auto,SG Manual,policy-select-name=PROXY
Google = select,PROXY,DIRECT,US Auto,US Manual,JP Auto,JP Manual,HK Auto,HK Manual,TW Auto,TW Manual,SG Auto,SG Manual,policy-select-name=PROXY
Microsoft = select,PROXY,DIRECT,US Auto,US Manual,JP Auto,JP Manual,HK Auto,HK Manual,TW Auto,TW Manual,SG Auto,SG Manual,policy-select-name=PROXY
Apple = select,PROXY,DIRECT,US Auto,US Manual,JP Auto,JP Manual,HK Auto,HK Manual,TW Auto,TW Manual,SG Auto,SG Manual,policy-select-name=PROXY
Final = select,PROXY,DIRECT,US Auto,US Manual,JP Auto,JP Manual,HK Auto,HK Manual,TW Auto,TW Manual,SG Auto,SG Manual,policy-select-name=PROXY
US Auto = url-test,url=http://cp.cloudflare.com/generate_204,interval=600,tolerance=50,timeout=5,select=0,policy-regex-filter=(?i)^.*(?:(?:🇺🇸|美国|United\s*States|(?:^|[^A-Za-z])(?:US|USA)(?:[0-9]+)?(?:$|[^A-Za-z]))).*$
US Manual = select,select=0,policy-regex-filter=(?i)^.*(?:(?:🇺🇸|美国|United\s*States|(?:^|[^A-Za-z])(?:US|USA)(?:[0-9]+)?(?:$|[^A-Za-z]))).*$
JP Auto = url-test,url=http://cp.cloudflare.com/generate_204,interval=600,tolerance=50,timeout=5,select=0,policy-regex-filter=(?i)^.*(?:(?:🇯🇵|日本|Japan|(?:^|[^A-Za-z])JP(?:[0-9]+)?(?:$|[^A-Za-z]))).*$
JP Manual = select,select=0,policy-regex-filter=(?i)^.*(?:(?:🇯🇵|日本|Japan|(?:^|[^A-Za-z])JP(?:[0-9]+)?(?:$|[^A-Za-z]))).*$
HK Auto = url-test,url=http://cp.cloudflare.com/generate_204,interval=600,tolerance=50,timeout=5,select=0,policy-regex-filter=(?i)^.*(?:(?:🇭🇰|香港|Hong\s*Kong|(?:^|[^A-Za-z])HK(?:[0-9]+)?(?:$|[^A-Za-z]))).*$
HK Manual = select,select=0,policy-regex-filter=(?i)^.*(?:(?:🇭🇰|香港|Hong\s*Kong|(?:^|[^A-Za-z])HK(?:[0-9]+)?(?:$|[^A-Za-z]))).*$
TW Auto = url-test,url=http://cp.cloudflare.com/generate_204,interval=600,tolerance=50,timeout=5,select=0,policy-regex-filter=(?i)^.*(?:(?:🇹🇼|台湾|臺灣|Taiwan|(?:^|[^A-Za-z])TW(?:[0-9]+)?(?:$|[^A-Za-z]))).*$
TW Manual = select,select=0,policy-regex-filter=(?i)^.*(?:(?:🇹🇼|台湾|臺灣|Taiwan|(?:^|[^A-Za-z])TW(?:[0-9]+)?(?:$|[^A-Za-z]))).*$
SG Auto = url-test,url=http://cp.cloudflare.com/generate_204,interval=600,tolerance=50,timeout=5,select=0,policy-regex-filter=(?i)^.*(?:(?:🇸🇬|新加坡|狮|獅|Singapore|(?:^|[^A-Za-z])SG(?:[0-9]+)?(?:$|[^A-Za-z]))).*$
SG Manual = select,select=0,policy-regex-filter=(?i)^.*(?:(?:🇸🇬|新加坡|狮|獅|Singapore|(?:^|[^A-Za-z])SG(?:[0-9]+)?(?:$|[^A-Za-z]))).*$

