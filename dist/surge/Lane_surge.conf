# Lane | Local profile template
# Last updated: 2026-09-02 14:40:37 (Asia/Shanghai)
# Lane 不提供节点；导入启用前，将你的订阅地址替换为本客户端支持的完整订阅链接。
# 建议复制/保存为本地配置，不跟随远程整份更新；节点与远程规则仍独立更新。
# 换用新版完整配置前，请备份并重新填入订阅地址及个人修改。
# Brokerage：富途/Moomoo 保留域名与 IP 覆盖；老虎、长桥仅保留实测关键域名；嘉信规则并入本组。
# Crypto：仅 Binance、OKX、Bybit、Bitget；当前网络可正常访问时，可手动选择 DIRECT。
# 上述两组默认均为 Proxy；分流只控制网络路径，不保证入金或交易结果。
# AppleCN：命中苹果大陆服务名单时优先 DIRECT，其他 Apple 服务仍走 Apple 策略组。
# Google 不再有大陆直连例外名单，全部域名统一走 Google 策略组。
# LAN：私有网段与本地域名直连，位于全部规则之前，带 no-resolve。
# China：已知中国域名先直连；General Proxy 随后保护已知境外域名，避免被后续 IP 判断误导。
# General Proxy 策略同为 Final，不是另一个出口；它仍位于业务 IP / CN IP / GEOIP 之前。
# CN IP：gaoyifan IPv4+IPv6 五次三次共识窗直连兜底，位于精细规则之后、GEOIP / Final 之前。

[General]
loglevel = notify
ipv6 = false
udp-policy-not-supported-behaviour = REJECT
allow-wifi-access = false
dns-server = system
tun-excluded-routes = 224.0.0.0/4, 239.255.255.250/32
always-real-ip = *.stun.*.*, *.stun.*.*.*, *.stun.*.*.*.*, *.stun.*.*.*.*.*, *.n.n.srv.nintendo.net, *.stun.playstation.net, xbox.*.*.microsoft.com, *.*.xboxlive.com, *.msftncsi.com, *.msftconnecttest.com, *.lan, *.local
hijack-dns = 8.8.8.8:53, 8.8.4.4:53
proxy-test-url = http://cp.cloudflare.com/generate_204
test-timeout = 5

[Proxy]

[Proxy Group]
# 在 policy-path 填写 Surge 格式节点订阅；第一份默认启用，订阅组在策略界面隐藏。
Subscription1 = select,policy-path=你的订阅地址,update-interval=86400,hidden=true
# Subscription2 = select,policy-path=你的订阅地址,update-interval=86400,hidden=true

# 多订阅：取消 Subscription2 注释并填写，再将 我的节点 引用改为 include-other-group="Subscription1,Subscription2"。
# 更多订阅复制订阅行、名称递增，并逐一加入 我的节点；它汇总全部真实代理节点。
我的节点 = select,include-other-group=Subscription1,include-all-proxies=true,icon-url=https://raw.githubusercontent.com/wenjinliuu/Lane/main/assets/icons/third-party/qure/Proxy.png
# Proxy 可选择地区 Smart，也可进入 我的节点 手动选择单节点。
Proxy = select,US Auto Smart,JP Auto Smart,HK Auto Smart,TW Auto Smart,SG Auto Smart,我的节点,icon-url=https://raw.githubusercontent.com/wenjinliuu/Lane/main/assets/icons/third-party/qure/Proxy.png
AI = select,Proxy,DIRECT,US Auto Smart,US Manual,JP Auto Smart,JP Manual,HK Auto Smart,HK Manual,TW Auto Smart,TW Manual,SG Auto Smart,SG Manual,icon-url=https://raw.githubusercontent.com/wenjinliuu/Lane/main/assets/icons/third-party/qure/AI.png
Brokerage = select,Proxy,DIRECT,US Auto Smart,US Manual,JP Auto Smart,JP Manual,HK Auto Smart,HK Manual,TW Auto Smart,TW Manual,SG Auto Smart,SG Manual,icon-url=https://raw.githubusercontent.com/wenjinliuu/Lane/main/assets/icons/third-party/qure/Magic.png
