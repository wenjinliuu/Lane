# Lane | Local profile template
# Last updated: 2026-08-31 15:03:33 (Asia/Shanghai)
# Lane 不提供节点；导入启用前，将你的订阅地址替换为本客户端支持的完整订阅链接。
# 建议复制/保存为本地配置，不跟随远程整份更新；节点与远程规则仍独立更新。
# 换用新版完整配置前，请备份并重新填入订阅地址及个人修改。
# Brokerage：富途/Moomoo、老虎、长桥，统一分流登录、行情及入金/交易相关连接。
# Crypto：仅 Binance、OKX、Bybit、Bitget；当前网络可正常访问时，可手动选择 DIRECT。
# Schwab：嘉信独立分流，可单独选择 DIRECT 或代理。
# 上述三组默认均为 Manual；分流只控制网络路径，不保证入金或交易结果。
# AppleCN：命中苹果大陆服务名单时优先 DIRECT，其他 Apple 服务仍走 Apple 策略组。
# Google 不再有大陆直连例外名单，全部域名统一走 Google 策略组。
# LAN：私有网段与本地域名直连，位于全部规则之前，带 no-resolve。
# China：已知中国域名先直连；General Proxy 随后保护已知境外域名，避免被后续 IP 判断误导。
# General Proxy 策略同为 Final，不是另一个出口；它仍位于业务 IP / CN IP / GEOIP 之前。
# CN IP：gaoyifan IPv4+IPv6 五次三次共识窗直连兜底，位于精细规则之后、GEOIP / Final 之前。

[General]
loglevel = notify
ipv6 = false
udp-policy-not-supported-behaviour = REJECT
allow-wifi-access = false
dns-server = system
tun-excluded-routes = 224.0.0.0/4, 239.255.255.250/32, ff02::fb/128
always-real-ip = *.stun.*.*, *.stun.*.*.*, *.stun.*.*.*.*, *.stun.*.*.*.*.*, *.n.n.srv.nintendo.net, *.stun.playstation.net, xbox.*.*.microsoft.com, *.*.xboxlive.com, *.msftncsi.com, *.msftconnecttest.com, *.lan, *.local
hijack-dns = 8.8.8.8:53, 8.8.4.4:53
proxy-test-url = http://cp.cloudflare.com/generate_204
test-timeout = 5

[Proxy]

[Proxy Group]
# 在 policy-path 填写 Surge 格式节点订阅；第一份默认启用，订阅组在策略界面隐藏。
Subscription1 = select,policy-path=你的订阅地址,update-interval=86400,hidden=true
# Subscription2 = select,policy-path=你的订阅地址,update-interval=86400,hidden=true

# 多订阅：取消 Subscription2 注释并填写，再将 Node Pool 引用改为 include-other-group="Subscription1,Subscription2"。
# 更多订阅复制订阅行、名称递增，并逐一加入隐藏 Node Pool；它只汇总真实代理节点。
Node Pool = select,include-other-group=Subscription1,include-all-proxies=true,hidden=true
# Manual 可直接选择地区 Smart，也保留 Node Pool 展开的全部单节点。
Manual = select,US Auto Smart,JP Auto Smart,HK Auto Smart,TW Auto Smart,SG Auto Smart,include-other-group=Node Pool
AI = select,Manual,DIRECT,US Auto Smart,US Manual,JP Auto Smart,JP Manual,HK Auto Smart,HK Manual,TW Auto Smart,TW Manual,SG Auto Smart,SG Manual
Schwab = select,Manual,DIRECT,US Auto Smart,US Manual,JP Auto Smart,JP Manual,HK Auto Smart,HK Manual,TW Auto Smart,TW Manual,SG Auto Smart,SG Manual
Brokerage = select,Manual,DIRECT,US Auto Smart,US Manual,JP Auto Smart,JP Manual,HK Auto Smart,HK Manual,TW Auto Smart,TW Manual,SG Auto Smart,SG Manual
Crypto = select,Manual,DIRECT,US Auto Smart,US Manual,JP Auto Smart,JP Manual,HK Auto Smart,HK Manual,TW Auto Smart,TW Manual,SG Auto Smart,SG Manual
YouTube = select,Manual,DIRECT,US Auto Smart,US Manual,JP Auto Smart,JP Manual,HK Auto Smart,HK Manual,TW Auto Smart,TW Manual,SG Auto Smart,SG Manual
TikTok = select,Manual,DIRECT,US Auto Smart,US Manual,JP Auto Smart,JP Manual,HK Auto Smart,HK Manual,TW Auto Smart,TW Manual,SG Auto Smart,SG Manual
Emby = select,Manual,DIRECT,US Auto Smart,US Manual,JP Auto Smart,JP Manual,HK Auto Smart,HK Manual,TW Auto Smart,TW Manual,SG Auto Smart,SG Manual
Streaming = select,Manual,DIRECT,US Auto Smart,US Manual,JP Auto Smart,JP Manual,HK Auto Smart,HK Manual,TW Auto Smart,TW Manual,SG Auto Smart,SG Manual
Gaming = select,Manual,DIRECT,US Auto Smart,US Manual,JP Auto Smart,JP Manual,HK Auto Smart,HK Manual,TW Auto Smart,TW Manual,SG Auto Smart,SG Manual
Telegram = select,Manual,DIRECT,US Auto Smart,US Manual,JP Auto Smart,JP Manual,HK Auto Smart,HK Manual,TW Auto Smart,TW Manual,SG Auto Smart,SG Manual
Social = select,Manual,DIRECT,US Auto Smart,US Manual,JP Auto Smart,JP Manual,HK Auto Smart,HK Manual,TW Auto Smart,TW Manual,SG Auto Smart,SG Manual
Developer = select,Manual,DIRECT,US Auto Smart,US Manual,JP Auto Smart,JP Manual,HK Auto Smart,HK Manual,TW Auto Smart,TW Manual,SG Auto Smart,SG Manual
Google = select,Manual,DIRECT,US Auto Smart,US Manual,JP Auto Smart,JP Manual,HK Auto Smart,HK Manual,TW Auto Smart,TW Manual,SG Auto Smart,SG Manual
Microsoft = select,Manual,DIRECT,US Auto Smart,US Manual,JP Auto Smart,JP Manual,HK Auto Smart,HK Manual,TW Auto Smart,TW Manual,SG Auto Smart,SG Manual
Apple = select,Manual,DIRECT,US Auto Smart,US Manual,JP Auto Smart,JP Manual,HK Auto Smart,HK Manual,TW Auto Smart,TW Manual,SG Auto Smart,SG Manual
Final = select,Manual,DIRECT,US Auto Smart,US Manual,JP Auto Smart,JP Manual,HK Auto Smart,HK Manual,TW Auto Smart,TW Manual,SG Auto Smart,SG Manual
# 地区组从隐藏 Node Pool 展开真实节点并正向筛选；不会与 Manual 形成循环。
US Auto Smart = smart,include-other-group=Node Pool,policy-regex-filter="(?i)^.*(?:(?:🇺🇸|美国|United\s*States|(?:^|[^A-Za-z])(?:US|USA)(?:[0-9]+)?(?:$|[^A-Za-z]))).*$"
US Manual = select,include-other-group=Node Pool,policy-regex-filter="(?i)^.*(?:(?:🇺🇸|美国|United\s*States|(?:^|[^A-Za-z])(?:US|USA)(?:[0-9]+)?(?:$|[^A-Za-z]))).*$"
JP Auto Smart = smart,include-other-group=Node Pool,policy-regex-filter="(?i)^.*(?:(?:🇯🇵|日本|Japan|(?:^|[^A-Za-z])JP(?:[0-9]+)?(?:$|[^A-Za-z]))).*$"
JP Manual = select,include-other-group=Node Pool,policy-regex-filter="(?i)^.*(?:(?:🇯🇵|日本|Japan|(?:^|[^A-Za-z])JP(?:[0-9]+)?(?:$|[^A-Za-z]))).*$"
HK Auto Smart = smart,include-other-group=Node Pool,policy-regex-filter="(?i)^.*(?:(?:🇭🇰|香港|Hong\s*Kong|(?:^|[^A-Za-z])HK(?:[0-9]+)?(?:$|[^A-Za-z]))).*$"
HK Manual = select,include-other-group=Node Pool,policy-regex-filter="(?i)^.*(?:(?:🇭🇰|香港|Hong\s*Kong|(?:^|[^A-Za-z])HK(?:[0-9]+)?(?:$|[^A-Za-z]))).*$"
TW Auto Smart = smart,include-other-group=Node Pool,policy-regex-filter="(?i)^.*(?:(?:🇹🇼|台湾|臺灣|Taiwan|(?:^|[^A-Za-z])TW(?:[0-9]+)?(?:$|[^A-Za-z]))).*$"
TW Manual = select,include-other-group=Node Pool,policy-regex-filter="(?i)^.*(?:(?:🇹🇼|台湾|臺灣|Taiwan|(?:^|[^A-Za-z])TW(?:[0-9]+)?(?:$|[^A-Za-z]))).*$"
SG Auto Smart = smart,include-other-group=Node Pool,policy-regex-filter="(?i)^.*(?:(?:🇸🇬|新加坡|狮|獅|Singapore|(?:^|[^A-Za-z])SG(?:[0-9]+)?(?:$|[^A-Za-z]))).*$"
SG Manual = select,include-other-group=Node Pool,policy-regex-filter="(?i)^.*(?:(?:🇸🇬|新加坡|狮|獅|Singapore|(?:^|[^A-Za-z])SG(?:[0-9]+)?(?:$|[^A-Za-z]))).*$"

