# Lane | Local profile template
# Last updated: 2026-08-28 21:30:49 (Asia/Shanghai)
# 使用前将示例链接替换为本客户端支持的节点订阅；示例地址不提供节点。
# 建议复制/保存为本地配置，不跟随远程整份更新；节点与远程规则仍独立更新。
# 换用新版完整配置前，请备份并重新填入订阅地址及个人修改；勿上传私人订阅。

[General]
loglevel = notify
ipv6 = false
allow-wifi-access = false
dns-server = system
proxy-test-url = http://cp.cloudflare.com/generate_204
test-timeout = 5

[Proxy]

[Proxy Group]
# 只需替换 Manual 的 policy-path；必须使用 Surge 支持的节点订阅格式。
Manual = select,policy-path=https://example.com/replace-with-your-subscription,update-interval=86400,include-all-proxies=true
AI = select,Manual,DIRECT,US Auto,US Manual,JP Auto,JP Manual,HK Auto,HK Manual,TW Auto,TW Manual,SG Auto,SG Manual
Schwab = select,Manual,DIRECT,US Auto,US Manual,JP Auto,JP Manual,HK Auto,HK Manual,TW Auto,TW Manual,SG Auto,SG Manual
Brokerage = select,Manual,DIRECT,US Auto,US Manual,JP Auto,JP Manual,HK Auto,HK Manual,TW Auto,TW Manual,SG Auto,SG Manual
Crypto = select,Manual,DIRECT,US Auto,US Manual,JP Auto,JP Manual,HK Auto,HK Manual,TW Auto,TW Manual,SG Auto,SG Manual
YouTube = select,Manual,DIRECT,US Auto,US Manual,JP Auto,JP Manual,HK Auto,HK Manual,TW Auto,TW Manual,SG Auto,SG Manual
TikTok = select,Manual,DIRECT,US Auto,US Manual,JP Auto,JP Manual,HK Auto,HK Manual,TW Auto,TW Manual,SG Auto,SG Manual
Emby = select,Manual,DIRECT,US Auto,US Manual,JP Auto,JP Manual,HK Auto,HK Manual,TW Auto,TW Manual,SG Auto,SG Manual
Streaming = select,Manual,DIRECT,US Auto,US Manual,JP Auto,JP Manual,HK Auto,HK Manual,TW Auto,TW Manual,SG Auto,SG Manual
Gaming = select,Manual,DIRECT,US Auto,US Manual,JP Auto,JP Manual,HK Auto,HK Manual,TW Auto,TW Manual,SG Auto,SG Manual
Telegram = select,Manual,DIRECT,US Auto,US Manual,JP Auto,JP Manual,HK Auto,HK Manual,TW Auto,TW Manual,SG Auto,SG Manual
Social = select,Manual,DIRECT,US Auto,US Manual,JP Auto,JP Manual,HK Auto,HK Manual,TW Auto,TW Manual,SG Auto,SG Manual
Developer = select,Manual,DIRECT,US Auto,US Manual,JP Auto,JP Manual,HK Auto,HK Manual,TW Auto,TW Manual,SG Auto,SG Manual
Google = select,Manual,DIRECT,US Auto,US Manual,JP Auto,JP Manual,HK Auto,HK Manual,TW Auto,TW Manual,SG Auto,SG Manual
Microsoft = select,Manual,DIRECT,US Auto,US Manual,JP Auto,JP Manual,HK Auto,HK Manual,TW Auto,TW Manual,SG Auto,SG Manual
Apple = select,Manual,DIRECT,US Auto,US Manual,JP Auto,JP Manual,HK Auto,HK Manual,TW Auto,TW Manual,SG Auto,SG Manual
Final = select,Manual,DIRECT,US Auto,US Manual,JP Auto,JP Manual,HK Auto,HK Manual,TW Auto,TW Manual,SG Auto,SG Manual
# 地区组展开 Manual 中的全部节点，再做正向筛选，不跟随其单个选中节点。
US Auto = url-test,include-other-group=Manual,policy-regex-filter="(?i)^.*(?:(?:🇺🇸|美国|United\s*States|(?:^|[^A-Za-z])(?:US|USA)(?:[0-9]+)?(?:$|[^A-Za-z]))).*$",interval=600,tolerance=50
US Manual = select,include-other-group=Manual,policy-regex-filter="(?i)^.*(?:(?:🇺🇸|美国|United\s*States|(?:^|[^A-Za-z])(?:US|USA)(?:[0-9]+)?(?:$|[^A-Za-z]))).*$"
JP Auto = url-test,include-other-group=Manual,policy-regex-filter="(?i)^.*(?:(?:🇯🇵|日本|Japan|(?:^|[^A-Za-z])JP(?:[0-9]+)?(?:$|[^A-Za-z]))).*$",interval=600,tolerance=50
JP Manual = select,include-other-group=Manual,policy-regex-filter="(?i)^.*(?:(?:🇯🇵|日本|Japan|(?:^|[^A-Za-z])JP(?:[0-9]+)?(?:$|[^A-Za-z]))).*$"
HK Auto = url-test,include-other-group=Manual,policy-regex-filter="(?i)^.*(?:(?:🇭🇰|香港|Hong\s*Kong|(?:^|[^A-Za-z])HK(?:[0-9]+)?(?:$|[^A-Za-z]))).*$",interval=600,tolerance=50
HK Manual = select,include-other-group=Manual,policy-regex-filter="(?i)^.*(?:(?:🇭🇰|香港|Hong\s*Kong|(?:^|[^A-Za-z])HK(?:[0-9]+)?(?:$|[^A-Za-z]))).*$"
TW Auto = url-test,include-other-group=Manual,policy-regex-filter="(?i)^.*(?:(?:🇹🇼|台湾|Taiwan|(?:^|[^A-Za-z])TW(?:[0-9]+)?(?:$|[^A-Za-z]))).*$",interval=600,tolerance=50
TW Manual = select,include-other-group=Manual,policy-regex-filter="(?i)^.*(?:(?:🇹🇼|台湾|Taiwan|(?:^|[^A-Za-z])TW(?:[0-9]+)?(?:$|[^A-Za-z]))).*$"
SG Auto = url-test,include-other-group=Manual,policy-regex-filter="(?i)^.*(?:(?:🇸🇬|新加坡|Singapore|(?:^|[^A-Za-z])SG(?:[0-9]+)?(?:$|[^A-Za-z]))).*$",interval=600,tolerance=50
SG Manual = select,include-other-group=Manual,policy-regex-filter="(?i)^.*(?:(?:🇸🇬|新加坡|Singapore|(?:^|[^A-Za-z])SG(?:[0-9]+)?(?:$|[^A-Za-z]))).*$"

