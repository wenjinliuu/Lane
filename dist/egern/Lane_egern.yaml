# Lane | Local profile template
# Last updated: 2026-08-30 00:09:18 (Asia/Shanghai)
# Lane 不提供节点；导入启用前，将你的订阅地址替换为本客户端支持的完整订阅链接。
# 建议复制/保存为本地配置，不跟随远程整份更新；节点与远程规则仍独立更新。
# 换用新版完整配置前，请备份并重新填入订阅地址及个人修改。
# Brokerage：富途/Moomoo、老虎、长桥，统一分流登录、行情及入金/交易相关连接。
# Crypto：仅 Binance、OKX、Bybit、Bitget；当前网络可正常访问时，可手动选择 DIRECT。
# Schwab：嘉信独立分流，可单独选择 DIRECT 或代理。
# 上述三组默认均为 Manual；分流只控制网络路径，不保证入金或交易结果。
# AppleCN：命中苹果大陆服务名单时优先 DIRECT，其他 Apple 服务仍走 Apple 策略组。
# Google 不再有大陆直连例外名单，全部域名统一走 Google 策略组。
# LAN：私有网段与本地域名直连，位于全部规则之前，带 no-resolve。
# General Proxy：策略同为 Final，作用是抢在 China / CN IP / GEOIP 之前接住已知境外域名，
#   不是另一个出口。
# CN IP：gaoyifan IPv4+IPv6 七日稳定窗直连兜底，位于精细规则之后、GEOIP / Final 之前。

ipv6: false
allow_external_connections: false
real_ip_domains:
- '*.stun.*.*'
- '*.stun.*.*.*'
- '*.stun.*.*.*.*'
- '*.stun.*.*.*.*.*'
- '*.n.n.srv.nintendo.net'
- '*.stun.playstation.net'
- xbox.*.*.microsoft.com
- '*.*.xboxlive.com'
- '*.msftncsi.com'
- '*.msftconnecttest.com'
- '*.lan'
- '*.local'
hijack_dns:
- 8.8.8.8:53
- 8.8.4.4:53
vif_excluded_routes:
- 224.0.0.0/4
- 239.255.255.250/32
- ff02::fb/128
proxy_latency_test_url: http://cp.cloudflare.com/generate_204
dns:
  bootstrap:
  - system
  forward:
  - wildcard:
      match: '*'
      value: bootstrap
# 在 Manual 的 urls 中填写 Egern 支持的节点订阅；第一份默认启用。
