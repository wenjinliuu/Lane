# Lane | Local profile template
# Last updated: 2026-08-28 21:30:49 (Asia/Shanghai)
# 使用前将示例链接替换为本客户端支持的节点订阅；示例地址不提供节点。
# 建议复制/保存为本地配置，不跟随远程整份更新；节点与远程规则仍独立更新。
# 换用新版完整配置前，请备份并重新填入订阅地址及个人修改；勿上传私人订阅。
ipv6: false
allow_external_connections: false
proxy_latency_test_url: http://cp.cloudflare.com/generate_204
dns:
  bootstrap:
  - system
  forward:
  - wildcard:
      match: '*'
      value: bootstrap
# 在 Manual 的 urls 中填写 Egern 支持的节点订阅。
policy_groups:
- select:
    name: Manual
    urls:
    - https://example.com/replace-with-your-subscription
    update_interval: 86400
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Proxy.png
