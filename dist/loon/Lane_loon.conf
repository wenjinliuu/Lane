# Lane | Local profile template
# Last updated: 2026-08-30 11:57:34 (Asia/Shanghai)
# Lane 不提供节点；导入启用前，将你的订阅地址替换为本客户端支持的完整订阅链接。
# 建议复制/保存为本地配置，不跟随远程整份更新；节点与远程规则仍独立更新。
# 换用新版完整配置前，请备份并重新填入订阅地址及个人修改。
# Brokerage：富途/Moomoo、老虎、长桥，统一分流登录、行情及入金/交易相关连接。
# Crypto：仅 Binance、OKX、Bybit、Bitget；当前网络可正常访问时，可手动选择 DIRECT。
# Schwab：嘉信独立分流，可单独选择 DIRECT 或代理。
# 上述三组默认均为 Manual；分流只控制网络路径，不保证入金或交易结果。
# AppleCN：命中苹果大陆服务名单时优先 DIRECT，其他 Apple 服务仍走 Apple 策略组。
# Google 不再有大陆直连例外名单，全部域名统一走 Google 策略组。
# LAN：私有网段与本地域名直连，位于全部规则之前，带 no-resolve。
# General Proxy：策略同为 Final，作用是抢在 China / CN IP / GEOIP 之前接住已知境外域名，
#   不是另一个出口。
# CN IP：gaoyifan IPv4+IPv6 七日稳定窗直连兜底，位于精细规则之后、GEOIP / Final 之前。

[General]
ipv6 = false
allow-wifi-access = false
skip-proxy = localhost, *.local, *.lan, *.home.arpa
bypass-tun = 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.88.99.0/24, 192.168.0.0/16, 198.51.100.0/24, 203.0.113.0/24, 255.255.255.255/32, 224.0.0.0/4, 239.255.255.250/32, ff02::fb/128
real-ip = *.stun.*.*, *.stun.*.*.*, *.stun.*.*.*.*, *.stun.*.*.*.*.*, *.n.n.srv.nintendo.net, *.stun.playstation.net, xbox.*.*.microsoft.com, *.*.xboxlive.com, *.msftncsi.com, *.msftconnecttest.com, *.lan, *.local
hijack-dns = 1.1.1.1:53, 1.0.0.1:53, 8.8.8.8:53, 8.8.4.4:53, 9.9.9.9:53, 114.114.114.114:53, 119.29.29.29:53, 223.5.5.5:53
proxy-test-url = http://cp.cloudflare.com/generate_204
test-timeout = 5

[Proxy]

# 在下面填写 Loon 格式节点订阅；也可通过应用内节点页面添加。
# 如重新导入远程配置，请选择保留节点/订阅，勿使用全部覆盖。
# 节点与规则的定时更新请在应用的资源更新设置中开启。
[Remote Proxy]
# 第一份默认启用；多订阅取消第二行注释并填写，更多订阅复制该行、别名递增。
# 新增订阅后，还要把它的别名补进下方每一条 Remote Filter。
Subscription1 = 你的订阅地址
# Subscription2 = 你的订阅地址

# Node and region filters. Each filter names the subscriptions it reads,
# which is what Loon's own example does; the alias list is not optional.
# 多订阅：在每行 NameRegex 之后按顺序补上别名，例如
#   US Nodes = NameRegex,Subscription1,Subscription2,FilterKey = "..."
[Remote Filter]
Manual Nodes = NameRegex,Subscription1,FilterKey = ".+"
US Nodes = NameRegex,Subscription1,FilterKey = "(?i)^.*(?:(?:🇺🇸|美|United\s*States|洛杉矶|圣何塞|西雅图|芝加哥|纽约|达拉斯|凤凰城|硅谷|(?:^|[^A-Za-z])(?:US|USA)(?:[0-9]+)?(?:$|[^A-Za-z]))).*$"
JP Nodes = NameRegex,Subscription1,FilterKey = "(?i)^.*(?:(?:🇯🇵|日|Japan|Tokyo|Osaka|东京|大阪|埼玉|名古屋|(?:^|[^A-Za-z])JP(?:[0-9]+)?(?:$|[^A-Za-z]))).*$"
HK Nodes = NameRegex,Subscription1,FilterKey = "(?i)^.*(?:(?:🇭🇰|港|Hong\s*Kong|(?:^|[^A-Za-z])HK(?:[0-9]+)?(?:$|[^A-Za-z]))).*$"
TW Nodes = NameRegex,Subscription1,FilterKey = "(?i)^.*(?:(?:🇹🇼|台|臺|Taiwan|Taipei|新北|彰化|(?:^|[^A-Za-z])TW(?:[0-9]+)?(?:$|[^A-Za-z]))).*$"
SG Nodes = NameRegex,Subscription1,FilterKey = "(?i)^.*(?:(?:🇸🇬|新加坡|狮城|獅城|Singapore|沪新|京新|深新|杭新|广新|(?:^|[^A-Za-z])SG(?:[0-9]+)?(?:$|[^A-Za-z]))).*$"

