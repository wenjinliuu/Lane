# Lane | Local profile template
# Last updated: 2026-08-31 18:24:52 (Asia/Shanghai)
# Lane 不提供节点；导入启用前，将你的订阅地址替换为本客户端支持的完整订阅链接。
# 建议复制/保存为本地配置，不跟随远程整份更新；节点与远程规则仍独立更新。
# 换用新版完整配置前，请备份并重新填入订阅地址及个人修改。
# Brokerage：富途/Moomoo 保留域名与 IP 覆盖；老虎、长桥仅保留实测关键域名。
# Crypto：仅 Binance、OKX、Bybit、Bitget；当前网络可正常访问时，可手动选择 DIRECT。
# Schwab：嘉信独立分流，可单独选择 DIRECT 或代理。
# 上述三组默认均为 Manual；分流只控制网络路径，不保证入金或交易结果。
# AppleCN：命中苹果大陆服务名单时优先 DIRECT，其他 Apple 服务仍走 Apple 策略组。
# Google 不再有大陆直连例外名单，全部域名统一走 Google 策略组。
# LAN：私有网段与本地域名直连，位于全部规则之前，带 no-resolve。
# China：已知中国域名先直连；General Proxy 随后保护已知境外域名，避免被后续 IP 判断误导。
# General Proxy 策略同为 Final，不是另一个出口；它仍位于业务 IP / CN IP / GEOIP 之前。
# CN IP：gaoyifan IPv4+IPv6 五次三次共识窗直连兜底，位于精细规则之后、GEOIP / Final 之前。

[General]
ip-mode = ipv4-only
udp-fallback-mode = REJECT
allow-wifi-access = false
bypass-tun = 224.0.0.0/4, 239.255.255.250/32, ff02::fb/128
real-ip = *.stun.*.*, *.stun.*.*.*, *.stun.*.*.*.*, *.stun.*.*.*.*.*, *.n.n.srv.nintendo.net, *.stun.playstation.net, xbox.*.*.microsoft.com, *.*.xboxlive.com, *.msftncsi.com, *.msftconnecttest.com, *.lan, *.local
hijack-dns = 8.8.8.8:53, 8.8.4.4:53
proxy-test-url = http://cp.cloudflare.com/generate_204
test-timeout = 5

[Proxy]

# 在下面填写 Loon 格式节点订阅；也可通过应用内节点页面添加。
# 如重新导入远程配置，请选择保留节点/订阅，勿使用全部覆盖。
# 节点与规则的定时更新请在应用的资源更新设置中开启。
[Remote Proxy]
# 第一份默认启用；多订阅取消第二行注释并填写，更多订阅复制该行、别名递增。
Subscription1 = 你的订阅地址
# Subscription2 = 你的订阅地址

# Node and region filters.
[Remote Filter]
Manual Nodes = NameRegex, FilterKey = ".+"
US Nodes = NameRegex, FilterKey = "(?i)^.*(?:(?:🇺🇸|美国|United\s*States|(?:^|[^A-Za-z])(?:US|USA)(?:[0-9]+)?(?:$|[^A-Za-z]))).*$"
JP Nodes = NameRegex, FilterKey = "(?i)^.*(?:(?:🇯🇵|日本|Japan|(?:^|[^A-Za-z])JP(?:[0-9]+)?(?:$|[^A-Za-z]))).*$"
HK Nodes = NameRegex, FilterKey = "(?i)^.*(?:(?:🇭🇰|香港|Hong\s*Kong|(?:^|[^A-Za-z])HK(?:[0-9]+)?(?:$|[^A-Za-z]))).*$"
TW Nodes = NameRegex, FilterKey = "(?i)^.*(?:(?:🇹🇼|台湾|臺灣|Taiwan|(?:^|[^A-Za-z])TW(?:[0-9]+)?(?:$|[^A-Za-z]))).*$"
SG Nodes = NameRegex, FilterKey = "(?i)^.*(?:(?:🇸🇬|新加坡|狮|獅|Singapore|(?:^|[^A-Za-z])SG(?:[0-9]+)?(?:$|[^A-Za-z]))).*$"

