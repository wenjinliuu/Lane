[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "proxyrules"
version = "0.1.0"
description = "One routing manifest, generated for Stash, Loon, and Shadowrocket."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "wenjinliuu"}]
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
proxyrules = "proxyrules.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

