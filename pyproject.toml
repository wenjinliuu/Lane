[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lane-routing"
version = "0.2.0"
description = "Lane: one routing manifest for Stash, Loon, Shadowrocket, Surge, Quantumult X and Egern."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "wenjinliuu"}]
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
lane = "proxyrules.cli:main"
proxyrules = "proxyrules.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
